[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freedock"
version = "0.2.0"
description = "Open-source driver and editor for the MiraBox N4 StreamDock - Windows & Linux, no vendor software."
readme = "README.md"
license = "MIT"
authors = [{ name = "agentkyo", email = "caioviniciusxd@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mirabox", "n4", "streamdock", "stream-deck", "macro-pad", "hid", "assetto-corsa", "msfs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "hidapi>=0.14",
    "PySide6>=6.6",
    "psutil>=5.9",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "evdev>=1.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/agentkyo/freedock"
Issues = "https://github.com/agentkyo/freedock/issues"

[project.scripts]
freedock = "freedock.cli:main"

[project.gui-scripts]
freedock-gui = "freedock.cli:gui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freedock = ["assets/**/*", "locales/*.json", "presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
